<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Testes das regras do formulário (navegador)</title>
<style>body{font:14px/1.5 system-ui;margin:2rem}li.ok{color:#0a6b2b}li.falha{color:#b3261e;font-weight:700}</style>
</head>
<body>
<h1>Regras do formulário "Apresentar meu cenário" (página única)</h1>
<p>Abra este arquivo por um servidor local (por exemplo, a pasta <code>site_crivia</code> servida na porta 8080: <code>/tests/regras.test.html</code>). Resultado em <code id="resumo"></code>.</p>
<ul id="lista"></ul>
<script src="../cenario/regras.js"></script>
<script>
(function () {
  var R = window.CRIVIA_REGRAS, lista = document.getElementById("lista"), ok = 0, falha = 0;
  function t(nome, fn) {
    var li = document.createElement("li");
    try { fn(); li.className = "ok"; li.textContent = "OK — " + nome; ok++; }
    catch (e) { li.className = "falha"; li.textContent = "FALHOU — " + nome + ": " + e.message; falha++; }
    lista.appendChild(li);
  }
  function igual(a, b, m) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((m || "") + " esperado " + JSON.stringify(b) + " obtido " + JSON.stringify(a)); }
  function verdade(c, m) { if (!c) throw new Error(m || "condição falsa"); }
  function valido() {
    return { situationCode: "atraso_custo_margem", contextAnswerCode: "cost", audienceProfile: "contractor", decisionRole: "decides",
      location: { type: "brazil", stateCode: "MG", cityCode: "3106200", cityName: "Belo Horizonte", countryCode: "", intlCity: "", foreignRegion: "" },
      narrative: "O cronograma atrasou e precisamos decidir como recuperar o prazo.", marketingConsent: false,
      contact: { name: "Ana Lima", organization: "", preferredChannel: "email", email: "ana@x.com", phone: "" } };
  }

  t("oito situações com códigos estáveis e pergunta contextual com 'Ainda não sei'", function () {
    igual(R.SITUACOES.map(function (s) { return s.v; }), ["obra_contrato_dificuldade", "atraso_custo_margem", "projeto_terreno_propostas", "planejamento_recursos_recuperacao",
      "medicao_alteracao_documentacao", "vistoria_recebimento_conferencia", "comunicacao_ia_3d", "outra_nao_sei"]);
    R.SITUACOES.forEach(function (s) { verdade(s.q && s.opcoes.some(function (o) { return o.v === "unknown" && o.l === "Ainda não sei"; }), s.v); });
  });
  t("texto exibido usa 'Inteligência Artificial' por extenso", function () {
    verdade(R.achar(R.SITUACOES, "comunicacao_ia_3d").l.indexOf("Inteligência Artificial") >= 0);
  });
  t("formulário válido não tem erros", function () { igual(R.validar(valido()), {}); });
  t("pergunta contextual é opcional; perfil e participação são exigidos", function () {
    var r = valido(); r.contextAnswerCode = ""; igual(R.validar(r), {});
    r.audienceProfile = ""; r.decisionRole = ""; igual(Object.keys(R.validar(r)).sort(), ["audienceProfile", "decisionRole"]);
  });
  t("Brasil exige estado e cidade da lista", function () {
    var r = valido(); r.location.stateCode = ""; r.location.cityCode = ""; igual(Object.keys(R.validar(r)).sort(), ["location.city", "location.state"]);
    r.location.stateCode = "SP"; igual(R.validar(r)["location.city"], "Escolha uma cidade da lista.");
  });
  t("Exterior exige país e cidade; região é opcional", function () {
    var r = valido(); r.location = { type: "international", countryCode: "", intlCity: "", foreignRegion: "" };
    igual(Object.keys(R.validar(r)).sort(), ["location.cityName", "location.country"]);
    r.location.countryCode = "PT"; r.location.intlCity = "Lisboa"; igual(R.validar(r), {});
  });
  t("trocar Brasil ↔ Exterior não envia campos residuais", function () {
    var r = valido(); r.location.countryCode = "PT"; r.location.intlCity = "Lisboa"; r.location.foreignRegion = "Lisboa";
    var p = R.montarPayload(r, R.lerOrigem(""), { idempotencyKey: "abcdefgh-1", deviceCategory: "desktop", privacyNoticeVersion: "minuta-0", formVersion: "form-2", elapsedMs: 9000 });
    igual(Object.keys(p.scenario.location).sort(), ["cityCode", "cityName", "countryCode", "stateCode", "type"]); igual(p.scenario.location.countryCode, "BR");
    r.location.type = "international"; r.location.stateCode = "MG";
    p = R.montarPayload(r, R.lerOrigem(""), { idempotencyKey: "abcdefgh-1", deviceCategory: "desktop", privacyNoticeVersion: "minuta-0", formVersion: "form-2", elapsedMs: 9000 });
    igual(Object.keys(p.scenario.location).sort(), ["cityName", "countryCode", "foreignRegion", "type"]); igual(p.scenario.location.cityName, "Lisboa");
  });
  t("relato: mínimo, máximo de 1200 e sem corte silencioso", function () {
    var r = valido(); r.narrative = "curto"; verdade(R.validar(r).narrative);
    r.narrative = "x".repeat(1201); verdade(R.validar(r).narrative); r.narrative = "x".repeat(1200); igual(R.validar(r), {});
  });
  t("canal escolhido exige o contato correspondente; o segundo canal é opcional mas validado", function () {
    var r = valido(); r.contact.preferredChannel = "whatsapp"; verdade(R.validar(r)["contact.phone"]);
    r.contact.phone = "+351 912 345 678"; igual(R.validar(r), {}); r.contact.email = "sem-arroba"; verdade(R.validar(r)["contact.email"]);
    r = valido(); r.contact.email = "sem-arroba"; verdade(R.validar(r)["contact.email"]); r.contact.email = "a@b.co"; r.contact.phone = "12"; verdade(R.validar(r)["contact.phone"]);
  });
  t("organização é opcional; nome é obrigatório", function () {
    var r = valido(); igual(R.validar(r), {}); r.contact.name = " "; verdade(R.validar(r)["contact.name"]);
  });
  t("normalização de telefone igual à do servidor", function () {
    igual(R.normalizarTelefone("(31) 98888-7777"), "+5531988887777"); igual(R.normalizarTelefone("+351 912 345 678"), "+351912345678");
    igual(R.normalizarTelefone("5531988887777"), "+5531988887777"); igual(R.normalizarTelefone("abc"), null); igual(R.normalizarTelefone("(00) 98888-7777"), null);
  });
  t("busca de cidade/país ignora acento e maiúsculas, começa-com antes de contém", function () {
    var itens = [["1", "São Paulo"], ["2", "Santa Paulina"], ["3", "Paulo Afonso"], ["4", "Brasília"]];
    igual(R.filtrar(itens, "sao paulo", 10).map(function (x) { return x[1]; }), ["São Paulo"]);
    igual(R.filtrar(itens, "PAULO", 10).map(function (x) { return x[1]; }), ["Paulo Afonso", "São Paulo"]);
    igual(R.filtrar(itens, "brasilia", 10).length, 1); igual(R.filtrar(itens, "", 2).length, 2);
  });
  t("parâmetros de origem: só valores permitidos; o resto é descartado", function () {
    igual(R.lerOrigem("?origem=produtos&interesse=P06").originCta, "produtos"); igual(R.lerOrigem("?origem=produtos&interesse=P06").productHint, "P06");
    igual(R.lerOrigem("?origem=%3Cscript%3E&interesse=P99").originCta, "direto"); igual(R.lerOrigem("?origem=%3Cscript%3E&interesse=P99").productHint, null);
    igual(R.lerOrigem("?utm_source=%3Cb%3Ex").utmSource, ""); igual(R.lerOrigem("?utm_source=google").utmSource, "google"); igual(R.lerOrigem("").originCta, "direto");
  });
  t("perguntas opcionais: só entram no payload se respondidas; máximo de 2 consequências", function () {
    var r = valido(); var ex = { idempotencyKey: "abcdefgh-1", deviceCategory: "desktop", privacyNoticeVersion: "minuta-0", formVersion: "form-2", elapsedMs: 9000 };
    var p = R.montarPayload(r, R.lerOrigem(""), ex);
    verdade(!("urgency" in p.scenario) && !("consequences" in p.scenario) && !("documents" in p.scenario) && !("estimatedRange" in p.scenario) && !("contactPeriod" in p.contact));
    r.urgency = "this_week"; r.consequences = ["penalty", "stoppage"]; r.documents = "partial"; r.estimatedRange = "1m_to_10m"; r.contact.contactPeriod = "morning";
    p = R.montarPayload(r, R.lerOrigem(""), ex);
    igual([p.scenario.urgency, p.scenario.consequences, p.scenario.documents, p.scenario.estimatedRange, p.contact.contactPeriod], ["this_week", ["penalty", "stoppage"], "partial", "1m_to_10m", "morning"]);
    igual(R.validar(r), {}); r.consequences = ["penalty", "stoppage", "other"]; verdade(R.validar(r).consequences);
  });
  t("payload: ciência do aviso registrada, sem marketing e sem produto escolhido", function () {
    var r = valido(); var p = R.montarPayload(r, R.lerOrigem("?origem=hero"), { idempotencyKey: "abcdefgh-1", deviceCategory: "desktop", privacyNoticeVersion: "minuta-0", formVersion: "form-2", elapsedMs: 9000 });
    igual(p.privacy, { privacyNoticeVersion: "minuta-0", acknowledged: true }); igual(p.schemaVersion, 2); igual(p.source.originCta, "hero"); verdade(!("productCode" in p.scenario));
  });
  document.getElementById("resumo").textContent = ok + " passaram, " + falha + " falharam";
  document.title = (falha ? "FALHOU " : "OK ") + ok + "/" + (ok + falha);
})();
</script>
</body>
</html>
