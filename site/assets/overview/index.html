  <script>
  /* design-system catalog bridge. Active only inside the catalog iframe: the catalog
     reuses the page's header, so the page's own copy is hidden; the Components view
     parks this live scene behind it (ds-bg) at one of the page's own scroll stations,
     driven through the page's Lenis instance; wheel over the catalog bar is forwarded. */
  (function () {
    var root = document.documentElement, embedded;
    try { embedded = window.top !== window; } catch (e) { embedded = true; }
    if (!embedded) return;
    root.classList.add('ds-embed');
    var saved = 0, target = null, told = false;
    function maxY() { return root.scrollHeight - innerHeight; }
    function go(y, immediate) {
      var l = window.lenis;
      if (l && l.scrollTo) l.scrollTo(y, { immediate: !!immediate, force: true });
      else scrollTo(0, y);
    }
    addEventListener('message', function (e) {
      var d = e.data;
      if (!d || typeof d.ds !== 'string') return;
      if (d.ds === 'bg') {
        if (!root.classList.contains('ds-bg')) { saved = scrollY; root.classList.add('ds-bg'); }
        target = +d.p || 0;
        go(maxY() * target, !d.smooth);
      } else if (d.ds === 'page') {
        if (!root.classList.contains('ds-bg')) return;
        root.classList.remove('ds-bg'); target = null;
        go(saved, true);
      } else if (d.ds === 'wheel' && !root.classList.contains('ds-bg')) {
        var l = window.lenis;
        if (l && l.scrollTo) l.scrollTo((l.targetScroll || scrollY) + d.dy);
        else scrollBy(0, d.dy);
      }
    });
    addEventListener('resize', function () { if (target !== null) go(maxY() * target, true); });
    /* ready = hydrated (Lenis exists) and the preloader veil has left the DOM */
    (function poll() {
      if (window.lenis && !document.querySelector('main [role="status"]')) {
        if (target !== null) go(maxY() * target, true);
        if (!told) { told = true; parent.postMessage({ ds: 'ready' }, '*'); }
        return;
      }
      setTimeout(poll, 150);
    })();
  })();
  </script>
